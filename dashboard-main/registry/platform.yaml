# Platform sources (NextData listing and catalog, repo validation tool): how deployments become products.
# Generic rules. The product-to-domain map is registry/product-domains.yaml. The inbox crosswalk.csv overrides
# both, name by name (scripts/seed_crosswalk.py writes a first version to review).

# Name prefix dp-<team>- -> team layer: the EDP team subdomain in NextData (EDP/OPS, EDP/HCP, ...).
# Shown on the product page; it is not a grouping on the dashboard.
teams:
  ops: Source systems
  hcp: HCP team
  patient: Patient team
  claims: Claims team
  gov: Governance
  nxd: Platform

# Business domain of a product, in this order: the inbox crosswalk, registry/product-domains.yaml,
# the first rule below whose phrase is in the name or whose word is one of the name's words,
# the team of the name prefix (team_domains), then default_domain.
domain_rules:
  - domain: Channel partner
    phrases: [channel-partner]
  - domain: Revenue / vials
    phrases: [buy-n-bill]
    words: [revenue, vial, vials, sales]
  - domain: Medical affairs
    phrases: [medical-affairs]
    words: [msl, kol]
  - domain: Market access
    words: [claims, payer, formulary, mmit, medb, laad, access]
  - domain: HCP
    words: [hcp, hco, veeva, h1, ama, hpd, call, territory, targeting, survey, media]
  - domain: Patient
    words: [patient, patients]
  - domain: Logistics
    words: [logistics, 3pl, shipment, shipments, inventory, distribution]
team_domains:
  patient: Patient
  hcp: HCP
  claims: Market access
default_domain: Unknown

# A product is not counted when its name matches one of these patterns (first match gives the reason).
exclude_patterns:
  - pattern: '(^|-)templates?(-|$)'
    reason: Template
  - pattern: '(^|-)(test|tests|testing)(-|$)'
    reason: Test
  - pattern: '(^|-)(dummy|sandbox|synthetic)(-|$)'
    reason: Sandbox or synthetic data
  - pattern: '^dp-[a-z]+-[a-z0-9]+-dp$'
    reason: Placeholder name (dp-<team>-<word>-dp)

# Teams whose products are tooling, not business data products.
exclude_teams: [gov, nxd]

# Not counted: every deployment unreachable and the catalog does not know the name.
exclude_unreachable_not_in_catalog: true
# Not counted: deployed only in a demo environment and never validated.
exclude_demo_only_unvalidated: true

# Environment preference, best first, when one product has several deployments.
env_rank: [prod, nxd, demo, dev]

# Words written in capitals when a display name is made from a technical name.
acronyms: [hcp, hco, crm, erp, oci, iqvia, nxd, api, id, kpi, rx, kol, us, eu, ama, hpd, laad, medb, mmit, mg, vs]
