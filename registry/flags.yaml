# Flag registry. Flags rest on facts, never on a blended score.
# Every flag carries an icon and a text label in the UI; colour is never the only signal.
#
# Fields
#   code        stable code used in the snapshot and URLs
#   label       text shown next to the icon
#   level       domain | product
#   definition  plain-language rule, approved at checkpoint H1
#   signal      red | orange | yellow  (the health signal the flag raises; see "Product signal" below)
#   fn          dotted path to the rule function
#   reason      template for the reason text; fields come from the rule function
#   applies_to  active | all   (active = not Retired and not Cancelled)
#
# Product signal (not drawn since 2026-10-08; it ranks the Needs attention list):
#   grey   the product is Retired or Cancelled
#   red / orange / yellow   the most severe signal among the product's flags
#   unreported  active, no flags, and never reviewed by its DPO ("Not yet reported")
#   green  active, no flags, reviewed
# Changing which signal a flag raises is a one-line edit here (product-owner decision, 2026-10-06).

- code: BEHIND
  label: Behind
  level: domain
  definition: The domain is at risk or off track. Certified is less than 90% of the number expected today.
  signal: red
  fn: pipeline.flags.behind
  reason: "{certified} live, {expected} expected by today, target {target}"

- code: OVERDUE
  label: Overdue
  level: product
  definition: The next gate is more than 14 days late.
  signal: red
  fn: pipeline.flags.overdue
  reason: "{gate} {gate_name} is {days} days late. Due {planned}."
  applies_to: active

- code: SLIPPING
  label: Slipping
  level: product
  definition: The planned go-live date moved later two or more times.
  signal: orange
  fn: pipeline.flags.slipping
  reason: "Go-live moved later {slips} times. First plan: {baseline}."
  applies_to: active

- code: UNUSED
  label: Unused
  level: product
  definition: Live for 60 or more days, with zero active users and no product that uses it. A missing usage number gives a warning, not a flag.
  signal: orange
  fn: pipeline.flags.unused
  reason: "Live {days} days. No users, no product uses it."
  applies_to: active

- code: NO_DPO
  label: No DPO
  level: product
  definition: The product passed G1 and has no data product owner.
  signal: yellow
  fn: pipeline.flags.no_dpo
  reason: "No data product owner."
  applies_to: active

- code: NOT_UPDATED
  label: Not updated
  level: product
  definition: The owner last reviewed the register row more than 14 days ago. A row that was never reviewed shows "Not yet reported".
  signal: yellow
  fn: pipeline.flags.not_updated
  reason: "Owner review is {days} days old ({reviewed})."
  applies_to: active

- code: PENDING_URN
  label: Pending URN
  level: product
  definition: The product is not in NextData yet. Its URN starts with "pending:".
  signal: yellow
  fn: pipeline.flags.pending_urn
  reason: "Not in NextData yet."
  applies_to: all
