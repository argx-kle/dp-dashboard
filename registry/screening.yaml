# Comment screening. A DPO comment matching any pattern or term is a blocker:
# comments are shown to executives and must not carry personal or health data.
# Patterns are Python regular expressions, matched case-insensitively.

patterns:
  email: "[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}"
  phone: "(?:\\+|00)\\d{1,3}[\\s./-]?(?:\\(?\\d{1,4}\\)?[\\s./-]?){2,5}\\d{2,4}|\\b0\\d{1,3}[\\s./-]?\\d{2,3}[\\s./-]?\\d{2}[\\s./-]?\\d{2}\\b"
  id_like: "\\b(?:[A-Z]{1,3}[-\\s]?\\d{6,}|\\d{2}[.\\-]\\d{2}[.\\-]\\d{2}[-\\s]?\\d{3}[.\\-]\\d{2}|\\d{9,})\\b"

terms:
  - diagnos
  - medical record
  - "\\bMRN\\b"
  - date of birth
  - "\\bDOB\\b"
  - social security
  - "\\bSSN\\b"
  - national number
  - patient name
  - prescription for
